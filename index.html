<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卡牌收货·卖货·库存</title>
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卡牌库存"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#e5e7eb;--txt:#111827;--muted:#6b7280;--blue:#2563eb;--green:#15803d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f7;color:#1f2937}.danger{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.stat{padding:14px}.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:21px;font-weight:800;margin-top:4px}
.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{flex:1}.tab.active{background:#111827;color:#fff}
.grid{display:grid;grid-template-columns:360px 1fr;gap:12px}.card{padding:15px}h2{font-size:17px;margin:0 0 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#4b5563;display:block;margin:0 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff;font-size:14px}
textarea{min-height:65px}.wide{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:180px}.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}th{color:#6b7280}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700}.buy{background:#dbeafe;color:#1d4ed8}.sell{background:#dcfce7;color:#166534}
.pos{color:var(--green)}.neg{color:var(--red)}.section{margin-top:12px}.stockgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stockitem{border:1px solid var(--line);border-radius:10px;padding:10px}.stockitem b{display:block}.stockitem small{color:var(--muted)}
.actions{display:flex;gap:4px;flex-wrap:wrap}.actions button{padding:6px 8px;font-size:11px}.foot{font-size:11px;color:var(--muted);margin-top:12px}
@media(max-width:720px){.wrap{padding:8px}.top{display:block}.top .toolbar{margin-top:8px}.stats{grid-template-columns:1fr 1fr;gap:7px}.stat{padding:11px}.stat .v{font-size:17px}.grid{display:block}.grid>.card{margin-bottom:9px}.formgrid{grid-template-columns:1fr 1fr}.stockgrid{grid-template-columns:1fr 1fr}
.tablewrap{overflow:visible}table{display:block;min-width:0}thead{display:none}tbody{display:block}tbody tr{display:grid;grid-template-columns:1fr auto;gap:4px 8px;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px}tbody td{border:0;padding:1px;display:block}tbody td:nth-child(3){grid-column:1/-1;font-weight:800;font-size:14px}.actions{grid-column:1/-1}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>📦 卡牌收货 · 卖货 · 库存</h1><div class="sub">完整版重建 · 收货JPY / 卖货CNY→JPY / 库存 / 今日利润 / 本月利润</div></div>
<div class="toolbar"><button class="btn secondary" onclick="exportData()">备份</button><label class="btn secondary" style="margin:0">恢复<input type="file" id="restoreFile" accept=".json" hidden></label><button class="btn secondary" onclick="exportCSV()">CSV</button></div></div>
<div class="stats">
<div class="stat"><div class="k">今日利润</div><div class="v" id="todayProfit">¥0</div></div>
<div class="stat"><div class="k">本月利润</div><div class="v" id="monthProfit">¥0</div></div>
<div class="stat"><div class="k">库存包数</div><div class="v" id="stockPacks">0</div></div>
<div class="stat"><div class="k">库存成本</div><div class="v" id="stockCost">¥0</div></div>
</div>
<div class="grid">
<section class="card">
<div class="tabs"><button id="buyTab" class="btn tab active" onclick="setMode('buy')">📥 收货</button><button id="sellTab" class="btn tab secondary" onclick="setMode('sell')">📤 卖货</button></div>
<div class="formgrid">
<div><label>日期</label><input id="date" type="date"></div>
<div><label>系列</label><select id="series"><option>OP17</option><option>OP16</option><option>OP15</option><option>OP14</option><option>OP13</option><option>EB04</option><option>EB03</option><option>高达</option><option>其他</option></select></div>
<div><label>种类</label><select id="kind"><option>散包</option><option>原膜</option><option>垃圾袋</option><option>切口</option></select></div>
<div><label>数量</label><input id="qty" type="number" min="0" step="1" placeholder="例如 24"></div>
<div><label>单位</label><select id="unit"><option value="pack">包</option><option value="hand">手（24包）</option></select></div>
<div><label id="priceLabel">收货单价（日元/所选单位）</label><input id="price" type="number" min="0" step="0.01"></div>
<div id="fxBox" style="display:none"><label>成交汇率 1 CNY = ? JPY</label><input id="fx" type="number" min="0" step="0.0001" placeholder="例如 20.50"></div>
<div id="jpyBox" style="display:none"><label>卖货折合日元</label><input id="jpyPreview" disabled value="¥0"></div>
<div class="wide"><label>客户 / 卖家</label><input id="party" placeholder="可选"></div>
<div class="wide"><label>备注</label><textarea id="note" placeholder="可选"></textarea></div>
</div>
<div class="hint">1手固定按24包换算库存。收货成本采用移动平均成本；卖货利润按卖出时库存平均成本计算。</div>
<button id="submitBtn" class="btn primary" style="width:100%;margin-top:11px" onclick="addTxn()">记一笔收货</button>
</section>
<section>
<div class="card"><h2>当前库存</h2><div id="stockGrid" class="stockgrid"></div></div>
<div class="card section"><h2>交易记录</h2>
<div class="toolbar"><input id="search" placeholder="搜索系列、种类、客户、备注" oninput="render()"><select id="filter" onchange="render()"><option value="">全部</option><option value="buy">收货</option><option value="sell">卖货</option></select></div>
<div class="tablewrap"><table><thead><tr><th>日期</th><th>类型</th><th>商品</th><th>数量</th><th>成交价</th><th>折合JPY</th><th>利润JPY</th><th>客户/卖家</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div></section></div>
<div class="foot">数据默认保存在当前浏览器。建议定期“备份”。删除交易后会自动重算库存和利润。</div>
</div>
<script>
(()=>{const KEY='card_inventory_full_v1',FX='card_inventory_fx_v1';let rows=[],mode='buy';const $=id=>document.getElementById(id);
const yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function packs(q,u){return Number(q||0)*(u==='hand'?24:1)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{rows=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch{rows=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(rows))}
window.setMode=m=>{mode=m;$('buyTab').className='btn tab '+(m==='buy'?'active':'secondary');$('sellTab').className='btn tab '+(m==='sell'?'active':'secondary');$('fxBox').style.display=$('jpyBox').style.display=m==='sell'?'block':'none';$('priceLabel').textContent=m==='buy'?'收货单价（日元/所选单位）':'卖货单价（人民币/所选单位）';$('submitBtn').textContent=m==='buy'?'记一笔收货':'记一笔卖货';preview()}
function preview(){let q=Number($('qty').value||0),p=Number($('price').value||0),r=Number($('fx').value||0);$('jpyPreview').value=yen(q*p*r)}['qty','price','fx'].forEach(x=>$(x).addEventListener('input',preview));
function recalc(){let stock={},out=[];for(const r of [...rows].sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))){let k=r.series+'|'+r.kind,s=stock[k]||{packs:0,cost:0};let pks=packs(r.qty,r.unit);if(r.type==='buy'){let total=Number(r.totalJPY||0);s.packs+=pks;s.cost+=total;r.profitJPY=0}else{let avg=s.packs>0?s.cost/s.packs:0,cost=Math.min(pks,s.packs)*avg;let rev=Number(r.totalJPY||0);r.profitJPY=rev-cost;s.cost=Math.max(0,s.cost-cost);s.packs=Math.max(0,s.packs-pks)}stock[k]=s;out.push(r)}return stock}
window.addTxn=()=>{let q=Number($('qty').value),p=Number($('price').value),u=$('unit').value;if(q<=0||p<0)return alert('请填写正确数量和价格');let fx=Number($('fx').value||0);if(mode==='sell'&&fx<=0)return alert('卖货时请填写成交汇率');if(mode==='sell')localStorage.setItem(FX,String(fx));let total=mode==='sell'?q*p*fx:q*p;rows.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random(),date:$('date').value,series:$('series').value,kind:$('kind').value,qty:q,unit:u,price:p,currency:mode==='sell'?'CNY':'JPY',fxRate:mode==='sell'?fx:null,totalJPY:total,type:mode,party:$('party').value.trim(),note:$('note').value.trim(),createdAt:new Date().toISOString()});save();$('qty').value='';$('price').value='';$('party').value='';$('note').value='';preview();render()}
window.del=id=>{if(confirm('删除这笔记录？删除后会自动重算库存和利润。')){rows=rows.filter(r=>r.id!==id);save();render()}}
window.editStock=(series,kind)=>{let v=prompt(series+' / '+kind+'\\n输入要增加/减少的库存包数（例如 24 或 -24）');if(v===null)return;let n=Number(v);if(!n)return;rows.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'',date:today(),series,kind,qty:Math.abs(n),unit:'pack',price:0,currency:'JPY',fxRate:null,totalJPY:0,type:n>0?'buy':'sell',party:'库存调整',note:'手动库存调整',createdAt:new Date().toISOString()});save();render()}
function render(){let stock=recalc(),t=today(),m=t.slice(0,7),tp=0,mp=0;rows.forEach(r=>{if(r.type==='sell'){if(r.date===t)tp+=Number(r.profitJPY||0);if((r.date||'').startsWith(m))mp+=Number(r.profitJPY||0)}});$('todayProfit').textContent=yen(tp);$('todayProfit').className='v '+(tp>=0?'pos':'neg');$('monthProfit').textContent=yen(mp);$('monthProfit').className='v '+(mp>=0?'pos':'neg');let sp=0,sc=0;Object.values(stock).forEach(s=>{sp+=s.packs;sc+=s.cost});$('stockPacks').textContent=Math.round(sp).toLocaleString();$('stockCost').textContent=yen(sc);
let sg=$('stockGrid');sg.innerHTML='';Object.entries(stock).filter(([k,s])=>s.packs>0).sort().forEach(([k,s])=>{let [series,kind]=k.split('|'),d=document.createElement('div');d.className='stockitem';d.innerHTML=`<b>${esc(series)} · ${esc(kind)}</b><small>${Math.round(s.packs)}包 · 平均成本 ${yen(s.packs?s.cost/s.packs:0)}/包</small><br><button class="btn secondary" style="margin-top:6px;padding:5px 8px" onclick="editStock('${esc(series)}','${esc(kind)}')">调整库存</button>`;sg.appendChild(d)});if(!sg.children.length)sg.innerHTML='<span class="sub">暂无库存</span>';
let q=$('search').value.trim().toLowerCase(),f=$('filter').value,list=[...rows].filter(r=>(!f||r.type===f)&&(!q||`${r.series} ${r.kind} ${r.party} ${r.note}`.toLowerCase().includes(q))).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));$('tbody').innerHTML=list.map(r=>`<tr><td>${esc(r.date)}</td><td><span class="pill ${r.type}">${r.type==='buy'?'收货':'卖货'}</span></td><td>${esc(r.series)} · ${esc(r.kind)}</td><td>${r.qty}${r.unit==='hand'?'手':'包'}${r.unit==='hand'?` (${packs(r.qty,r.unit)}包)`:''}</td><td>${r.type==='sell'?Number(r.price).toLocaleString('zh-CN')+' CNY':yen(r.price)}${r.fxRate?`<br><small>汇率 ${r.fxRate}</small>`:''}</td><td>${yen(r.totalJPY)}</td><td class="${Number(r.profitJPY||0)>=0?'pos':'neg'}">${r.type==='sell'?yen(r.profitJPY):'—'}</td><td>${esc(r.party||'')}</td><td class="actions"><button class="btn danger" onclick="del('${r.id}')">删除</button></td></tr>`).join('')}
window.render=render;
window.exportData=()=>{let b=new Blob([JSON.stringify({version:1,rows},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='卡牌库存备份_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());let rr=Array.isArray(x)?x:x.rows;if(!Array.isArray(rr))throw 0;if(confirm('恢复会覆盖当前本地数据，继续？')){rows=rr;save();render()}}catch{alert('备份文件格式不正确')}e.target.value=''}
window.exportCSV=()=>{recalc();let h=['日期','类型','系列','种类','数量','单位','成交价','币种','汇率','折合日元','利润日元','客户/卖家','备注'],a=[h,...rows.map(r=>[r.date,r.type==='buy'?'收货':'卖货',r.series,r.kind,r.qty,r.unit==='hand'?'手(24包)':'包',r.price,r.currency,r.fxRate||'',r.totalJPY,r.profitJPY||0,r.party||'',r.note||''])],csv='\ufeff'+a.map(x=>x.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),b=new Blob([csv],{type:'text/csv;charset=utf-8'}),x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='卡牌交易_'+today()+'.csv';x.click();URL.revokeObjectURL(x.href)}
$('date').value=today();$('fx').value=localStorage.getItem(FX)||'';load();setMode('buy');render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=1').catch(()=>{}));
})();
</script></body></html>
